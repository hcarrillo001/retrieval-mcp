name: Publish MCP image

# Tag a release to publish:  git tag v1.0.0 && git push origin v1.0.0
# Also runnable by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # the Python lives in retrieval-mcp/, not at the repo root
          context: ./retrieval-mcp
          file: ./retrieval-mcp/Dockerfile.mcp
          push: true
          platforms: linux/amd64,linux/arm64   # arm64 so Apple Silicon runs native
          tags: |
            ghcr.io/${{ github.repository_owner }}/retrieval-mcp:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/retrieval-mcp:latest
          # must match server.json `name`, or the MCP registry rejects the publish
          labels: io.modelcontextprotocol.server.name=io.github.${{ github.repository_owner }}/retrieval-mcp
