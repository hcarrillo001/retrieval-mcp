<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eval report · retriEVAL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/report.css">
<style>
  body{margin:0;background:#F7F7F4;color:#0B0B0F;font-family:"Geist",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .nav{border-bottom:1px solid #E3E2DD;background:rgba(247,247,244,.85);position:sticky;top:0;z-index:5;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .nav .row{display:flex;align-items:center;gap:16px;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B0B0F;font-weight:600;font-size:18px;letter-spacing:-.02em;}
  .brand .e{color:#2F5BEA;}
  .nav .sp{flex:1;}
  .nav a.l{color:#5F6068;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:8px;}
  .nav a.l:hover{color:#0B0B0F;background:rgba(11,11,15,.05);}
  h1{font-weight:450;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.04em;line-height:1.05;margin:48px 0 8px;}
  .lead{color:#5F6068;margin:0 0 28px;font-size:15px;}
  .lead code{font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;}
  #report{margin-bottom:64px;}
  .msg{background:#fff;border:1px solid #E3E2DD;border-radius:14px;padding:28px;color:#5F6068;}
</style>
</head>
<body>
<nav class="nav"><div class="wrap row">
  <a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="13.5" cy="13.5" r="9" stroke="currentColor" stroke-width="2.4"/><path d="M20.5 20.5L27 27" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M9.5 13.8l2.8 2.8 5-5.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>retri<span class="e">EVAL</span></a>
  <span class="sp"></span>
  <a class="l" id="dashLink" href="/dashboard">Dashboard</a>
  <a class="l" href="/#sandbox">Sandbox</a>
</div></nav>
<main class="wrap">
  <h1 id="title">Eval report</h1>
  <p class="lead" id="lead">Loading the run…</p>
  <div id="report"></div>
</main>
<script src="/report.js"></script>
<script>
(async function () {
  var q = new URLSearchParams(location.search), id = q.get("run"), key = q.get("key");
  var el = document.getElementById("report"), lead = document.getElementById("lead");
  var esc = RetrievalReport.esc;
  function fail(m) { lead.textContent = ""; el.innerHTML = '<div class="msg">' + esc(m) + "</div>"; }
  if (!id) return fail("No run given. Open a report from an eval result (report_url), or pick a run in the dashboard.");
  if (key) document.getElementById("dashLink").href = "/dashboard?run=" + encodeURIComponent(id) + "&key=" + encodeURIComponent(key);
  else document.getElementById("dashLink").href = "/dashboard?run=" + encodeURIComponent(id);
  try {
    var r = await fetch("/api/runs?run=" + encodeURIComponent(id) + (key ? "&key=" + encodeURIComponent(key) : ""));
    if (r.status === 401) return fail("This report needs the dashboard key. Open it from the link the eval returned.");
    if (!r.ok) return fail("Couldn't load this run (error " + r.status + ").");
    var rows = await r.json(), run = Array.isArray(rows) ? rows[0] : rows;
    if (!run) return fail("No run with id " + id + ". It may have been saved to a local history file instead of Supabase.");
    document.title = "Eval report · " + (run.label || run.golden_set || id);
    document.getElementById("title").textContent = run.label || ("Eval report: " + (run.golden_set || "run"));
    lead.innerHTML = "<code>" + esc(run.run_id) + "</code> · " + esc(run.timestamp || "") +
      (run.generator_model ? " · generated by " + esc(run.generator_model) : "") +
      " · " + (run.per_case || []).length + " case" + ((run.per_case || []).length === 1 ? "" : "s");
    RetrievalReport.mount(el, run, {});
  } catch (e) { fail("Couldn't load this run: " + e); }
})();
</script>
</body>
</html>
